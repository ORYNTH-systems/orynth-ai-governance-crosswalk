<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#F8F9FB"/>
  <text x="800" y="82" text-anchor="middle" font-family="Segoe UI, Arial" font-size="46" font-weight="700" fill="#1E2230">ORYNTH AI Governance Crosswalk</text>
  <text x="800" y="128" text-anchor="middle" font-family="Segoe UI, Arial" font-size="22" fill="#52657A">Public evidence reference for architectural correspondence — not legal compliance</text>
  <line x1="80" y1="150" x2="1520" y2="150" stroke="#D6DCE4"/>

  <rect x="90" y="190" width="560" height="410" rx="18" fill="#1C3052"/>
  <text x="370" y="350" text-anchor="middle" font-family="Segoe UI, Arial" font-size="140" font-weight="700" fill="white">34</text>
  <text x="370" y="415" text-anchor="middle" font-family="Segoe UI, Arial" font-size="30" font-weight="700" fill="white">AI governance requirements evaluated</text>
  <text x="370" y="465" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" fill="white">25 from Executive Order 14409</text>
  <text x="370" y="500" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" fill="white">9 from Minnesota HF 1606 / Chapter 72</text>
  <text x="370" y="555" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" fill="white">Every determination is traceable to public source material</text>
  <text x="370" y="580" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" fill="white">and publicly available ORYNTH evidence.</text>

  <text x="710" y="215" font-family="Segoe UI, Arial" font-size="30" font-weight="700" fill="#1E2230">Canonical compatibility findings</text>

  <g font-family="Segoe UI, Arial">
    <rect x="710" y="235" width="800" height="82" rx="12" fill="white" stroke="#D6DCE4"/>
    <text x="775" y="288" text-anchor="middle" font-size="42" font-weight="700" fill="#2F855A">0</text>
    <text x="835" y="270" font-size="23" font-weight="700" fill="#1E2230">Addressed</text>
    <text x="835" y="299" font-size="16" fill="#52657A">No row met the full architectural-evidence threshold.</text>

    <rect x="710" y="329" width="800" height="82" rx="12" fill="white" stroke="#D6DCE4"/>
    <text x="775" y="382" text-anchor="middle" font-size="42" font-weight="700" fill="#2F855A">9</text>
    <text x="835" y="364" font-size="23" font-weight="700" fill="#1E2230">Partially Addressed</text>
    <text x="835" y="393" font-size="16" fill="#52657A">Material architectural support exists, but residual duties remain.</text>

    <rect x="710" y="423" width="800" height="82" rx="12" fill="white" stroke="#D6DCE4"/>
    <text x="775" y="476" text-anchor="middle" font-size="42" font-weight="700" fill="#2563EB">4</text>
    <text x="835" y="458" font-size="23" font-weight="700" fill="#1E2230">Related</text>
    <text x="835" y="487" font-size="16" fill="#52657A">A relevant mechanism exists but does not perform the central duty.</text>

    <rect x="710" y="517" width="800" height="82" rx="12" fill="white" stroke="#D6DCE4"/>
    <text x="775" y="570" text-anchor="middle" font-size="42" font-weight="700" fill="#526773">8</text>
    <text x="835" y="552" font-size="23" font-weight="700" fill="#1E2230">Not Applicable</text>
    <text x="835" y="581" font-size="16" fill="#52657A">The duty falls outside the declared architectural scope.</text>

    <rect x="710" y="611" width="800" height="82" rx="12" fill="white" stroke="#D6DCE4"/>
    <text x="775" y="664" text-anchor="middle" font-size="42" font-weight="700" fill="#BE2828">13</text>
    <text x="835" y="646" font-size="23" font-weight="700" fill="#1E2230">Gap</text>
    <text x="835" y="675" font-size="16" fill="#52657A">No qualifying public ORYNTH mechanism currently addresses the duty.</text>
  </g>

  <rect x="90" y="720" width="1420" height="82" rx="14" fill="white" stroke="#D6DCE4"/>
  <text x="120" y="753" font-family="Segoe UI, Arial" font-size="24" font-weight="700" fill="#1E2230">Evidence-controlled method</text>
  <text x="120" y="785" font-family="Segoe UI, Arial" font-size="17" font-weight="600" fill="#1C3052">✓ Primary sources   ✓ Duty extraction   ✓ Public evidence mapping   ✓ Deterministic adjudication   ✓ Adversarial review</text>

  <text x="800" y="838" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" fill="#1E2230">Unsupported coverage remains a gap rather than being upgraded for presentation.</text>
  <text x="800" y="874" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" fill="#52657A">github.com/ORYNTH-systems/orynth-ai-governance-crosswalk</text>
</svg>
